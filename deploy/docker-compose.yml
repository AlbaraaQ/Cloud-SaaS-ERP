# ---------------------------------------------------------------------------
# نشرٌ كامل بحاويةٍ واحدة لكل خدمة: `docker compose -f deploy/docker-compose.yml up -d --build`
#
# المنافذ على المضيف (مطابقةً لخريطة المنافذ في README):
#   http://localhost:3000  واجهة الـAPI  (و`/health` للفحص، و`/docs` للتوثيق)
#   http://localhost:3001  تطبيق الموظفين (staff)
#   http://localhost:3002  الموقع التسويقي (marketing)
#   http://localhost:3003  لوحة المنصة (platform-admin)
#   http://localhost:8025  MailHog (بريد التطوير)
#
# الخدمات الدنيا (postgres · redis · mailhog · minio) موجودةٌ أيضاً في
# `infrastructure/docker-compose.yml` للتطوير المحلي بلا تطبيقات — وهذا الملف هو النشر الكامل.
#
# المتغيّرات: انسخ `deploy/.env.example` إلى `deploy/.env` وعدّل ما يلزم. و`deploy/.env`
# مُستثنى من Git (`.gitignore`) لأن فيه أسراراً.
# ---------------------------------------------------------------------------
name: erp

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16
    container_name: erp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d ${POSTGRES_DB:-app}']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *restart
    image: redis:7
    container_name: erp-redis
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    <<: *restart
    image: mailhog/mailhog:v1.0.1
    container_name: erp-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

  # يهيّئ الأدوار وقاعدة البيانات ثم يطبّق الترحيلات والبذرة مرّةً واحدة قبل الإقلاع.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: erp-api:local
    container_name: erp-migrate
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      # الأدوار التي تُنشئها `pnpm db:roles`: تطبيقٌ محدود (erp_api) ومُرحِّل (erp_migrator).
      DATABASE_APP_ROLE: erp_api
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?DATABASE_APP_PASSWORD مطلوب — انظر deploy/.env.example}
      DATABASE_MIGRATOR_ROLE: erp_migrator
      DATABASE_MIGRATOR_PASSWORD: ${DATABASE_MIGRATOR_PASSWORD:?DATABASE_MIGRATOR_PASSWORD مطلوب}
      DATABASE_URL: postgres://erp_api:${DATABASE_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      DATABASE_MIGRATOR_URL: postgres://erp_migrator:${DATABASE_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      SEED_DEMO: ${SEED_DEMO:-1}
    entrypoint: ['/bin/sh', '-lc']
    command: >
      "pnpm --dir packages/database run roles &&
       pnpm --dir packages/database run migrate &&
       if [ \"$$SEED_DEMO\" = \"1\" ]; then pnpm --dir apps/api run seed; fi"
    restart: 'no'

  api:
    <<: *restart
    image: erp-api:local
    container_name: erp-api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgres://erp_api:${DATABASE_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      SMTP_HOST: mailhog
      SMTP_PORT: '1025'
      SMTP_SECURE: 'false'
      WORKER: '1'
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET مطلوب — انظر deploy/.env.example}
      CONSOLE_PUBLIC_URL: ${CONSOLE_PUBLIC_URL:-http://localhost:3003}
      STAFF_PUBLIC_URL: ${STAFF_PUBLIC_URL:-http://localhost:3001}
      MARKETING_PUBLIC_URL: ${MARKETING_PUBLIC_URL:-http://localhost:3002}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3001,http://localhost:3002,http://localhost:3003}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3000/health/live\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  marketing:
    <<: *restart
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP: marketing
        PORT: '3002'
        # يُخبَز في `rewrites` وقت البناء لأن مخرج `standalone` يجمّد الإعداد.
        API_PROXY_TARGET: http://api:3000
    image: erp-marketing:local
    container_name: erp-marketing
    depends_on:
      api: { condition: service_started }
    environment:
      NODE_ENV: production
      PORT: '3002'
      # نسخة وقت التشغيل للخادم المُصغَّر (اطّلاعات)، والأصل مُخبوزٌ وقت البناء أعلاه.
      API_PROXY_TARGET: http://api:3000
    ports:
      - '3002:3002'

  staff:
    <<: *restart
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP: staff
        PORT: '3001'
        # يُخبَز في `rewrites` وقت البناء لأن مخرج `standalone` يجمّد الإعداد.
        API_PROXY_TARGET: http://api:3000
    image: erp-staff:local
    container_name: erp-staff
    depends_on:
      api: { condition: service_started }
    environment:
      NODE_ENV: production
      PORT: '3001'
      API_PROXY_TARGET: http://api:3000
    ports:
      - '3001:3001'

  platform-admin:
    <<: *restart
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        APP: platform-admin
        PORT: '3003'
        # يُخبَز في `rewrites` وقت البناء لأن مخرج `standalone` يجمّد الإعداد.
        API_PROXY_TARGET: http://api:3000
    image: erp-platform-admin:local
    container_name: erp-platform-admin
    depends_on:
      api: { condition: service_started }
    environment:
      NODE_ENV: production
      PORT: '3003'
      API_PROXY_TARGET: http://api:3000
    ports:
      - '3003:3003'

volumes:
  postgres_data:
  redis_data:
