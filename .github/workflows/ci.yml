name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  verify:
    name: verify (typegen → tsc → lint → unit → integration → build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Integration tests use the service container instead of the embedded
      # PostgreSQL fallback (see packages/testing/src/test-database.ts).
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
      - name: OpenAPI breaking-change check (oasdiff)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          # Non-blocking until the baseline artifact is committed on main (Phase 23 hardening).
          echo "oasdiff baseline comparison placeholder — see API_ARCHITECTURE.md §6"
      - name: production dependency audit
        run: pnpm audit --prod --audit-level=high || true
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: packages/contracts/openapi.json

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
